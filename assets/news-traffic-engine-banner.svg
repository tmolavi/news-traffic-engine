<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090D16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle Top Decorative Laser Line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#primaryGrad)" stroke-width="3"/>

  <!-- Top Category Pill / Badge -->
  <g transform="translate(80, 55)">
    <rect width="320" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="18" cy="17" r="5" fill="#34D399" filter="url(#glow)"/>
    <text x="32" y="22" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1.5">AUTONOMOUS AI AGENT SYSTEM</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="150" fill="url(#primaryGrad)" font-size="54" font-weight="900" letter-spacing="-1.5">
    NEWS TRAFFIC ENGINE
  </text>
  <text x="80" y="200" fill="#94A3B8" font-size="21" font-weight="500" letter-spacing="-0.3">
    Instant Google News Indexing · Generative Engine Optimization (GEO) · Discover Growth
  </text>

  <!-- 4 Pillar Architecture Grid Cards -->
  <!-- Card 1: Fast Indexing -->
  <g transform="translate(80, 245)">
    <rect width="240" height="185" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="36" cy="36" r="18" fill="#0369A1" fill-opacity="0.4"/>
    <text x="30" y="42" fill="#38BDF8" font-size="18">⚡</text>
    <text x="64" y="42" fill="#F8FAFC" font-size="16" font-weight="700">Sub-15m Indexing</text>
    <text x="24" y="80" fill="#94A3B8" font-size="12" font-weight="400">
      <tspan x="24" dy="0">• Google Indexing API Batch</tspan>
      <tspan x="24" dy="20">• IndexNow (Bing, Yahoo, Yandex)</tspan>
      <tspan x="24" dy="20">• 48h Google News XML Feeds</tspan>
      <tspan x="24" dy="20">• Top Stories Pipeline Entry</tspan>
    </text>
    <rect x="24" y="148" width="85" height="20" rx="5" fill="#0284C7" fill-opacity="0.3"/>
    <text x="32" y="162" fill="#38BDF8" font-size="10" font-weight="700">SEARCH FAST-LANE</text>
  </g>

  <!-- Card 2: GEO & Citability -->
  <g transform="translate(340, 245)">
    <rect width="240" height="185" rx="14" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="36" cy="36" r="18" fill="#4338CA" fill-opacity="0.4"/>
    <text x="29" y="42" fill="#818CF8" font-size="18">🤖</text>
    <text x="64" y="42" fill="#F8FAFC" font-size="16" font-weight="700">GEO Citability</text>
    <text x="24" y="80" fill="#94A3B8" font-size="12" font-weight="400">
      <tspan x="24" dy="0">• 45-Word Direct Answer Lead</tspan>
      <tspan x="24" dy="20">• 130-175w Passage Chunking</tspan>
      <tspan x="24" dy="20">• Perplexity &amp; ChatGPT Search</tspan>
      <tspan x="24" dy="20">• /llms.txt &amp; RAG Ready Chunks</tspan>
    </text>
    <rect x="24" y="148" width="95" height="20" rx="5" fill="#4F46E5" fill-opacity="0.3"/>
    <text x="32" y="162" fill="#A5B4FC" font-size="10" font-weight="700">AI SEARCH PROVEN</text>
  </g>

  <!-- Card 3: Syndication -->
  <g transform="translate(600, 245)">
    <rect width="240" height="185" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="36" cy="36" r="18" fill="#047857" fill-opacity="0.4"/>
    <text x="29" y="42" fill="#34D399" font-size="18">🌐</text>
    <text x="64" y="42" fill="#F8FAFC" font-size="16" font-weight="700">Viral Syndication</text>
    <text x="24" y="80" fill="#94A3B8" font-size="12" font-weight="400">
      <tspan x="24" dy="0">• n8n Automated Webhook Flow</tspan>
      <tspan x="24" dy="20">• Telegram, Eitaa, Bale Channels</tspan>
      <tspan x="24" dy="20">• X / Twitter &amp; LinkedIn Dispatch</tspan>
      <tspan x="24" dy="20">• VAPID Web Push (10-25% CTR)</tspan>
    </text>
    <rect x="24" y="148" width="95" height="20" rx="5" fill="#059669" fill-opacity="0.3"/>
    <text x="32" y="162" fill="#6EE7B7" font-size="10" font-weight="700">OMNICHANNEL SYNC</text>
  </g>

  <!-- Card 4: Google Discover & Core Web Vitals -->
  <g transform="translate(860, 245)">
    <rect width="260" height="185" rx="14" fill="url(#cardGrad)" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="36" cy="36" r="18" fill="#7E22CE" fill-opacity="0.4"/>
    <text x="29" y="42" fill="#C084FC" font-size="18">📈</text>
    <text x="64" y="42" fill="#F8FAFC" font-size="16" font-weight="700">Google Discover</text>
    <text x="24" y="80" fill="#94A3B8" font-size="12" font-weight="400">
      <tspan x="24" dy="0">• max-image-preview:large</tspan>
      <tspan x="24" dy="20">• 1200px+ Image Compliance</tspan>
      <tspan x="24" dy="20">• Sub-1.2s Mobile LCP Target</tspan>
      <tspan x="24" dy="20">• NewsArticle &amp; LiveBlog Schema</tspan>
    </text>
    <rect x="24" y="148" width="105" height="20" rx="5" fill="#9333EA" fill-opacity="0.3"/>
    <text x="32" y="162" fill="#E9D5FF" font-size="10" font-weight="700">DISCOVER QUALIFIED</text>
  </g>

  <!-- Bottom Ecosystem & Attribution Ribbon -->
  <g transform="translate(80, 475)">
    <rect width="1040" height="95" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Architect Info -->
    <g transform="translate(30, 24)">
      <text x="0" y="18" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">SYSTEM ARCHITECT</text>
      <text x="0" y="42" fill="#F8FAFC" font-size="18" font-weight="800">Taghi Molavi</text>
      <text x="125" y="42" fill="#38BDF8" font-size="14" font-weight="600">molavi.pro</text>
      <text x="0" y="58" fill="#94A3B8" font-size="11">Author of GEO-Scope &amp; SAGE Audit</text>
    </g>

    <!-- Divider -->
    <line x1="380" y1="20" x2="380" y2="75" stroke="#334155" stroke-width="1"/>

    <!-- Enterprise Partner Info -->
    <g transform="translate(415, 24)">
      <text x="0" y="18" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">ENTERPRISE DIGITAL MARKETING PARTNER</text>
      <text x="0" y="42" fill="#F8FAFC" font-size="18" font-weight="800">Inten Digital Marketing Agency</text>
      <text x="315" y="42" fill="#34D399" font-size="14" font-weight="600">inten.asia</text>
      <text x="0" y="58" fill="#94A3B8" font-size="11">High-Traffic Infrastructure &amp; AI Enterprise Acceleration</text>
    </g>

    <!-- Agent Compatibility Badges -->
    <g transform="translate(820, 32)">
      <rect width="190" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="21" fill="#E2E8F0" font-size="11" font-weight="600">🤖 Hermes · Claude · AGY · Cursor</text>
    </g>
  </g>
</svg>
